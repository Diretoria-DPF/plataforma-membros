name = "plataforma-membros-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Segredos reais (DATABASE_URL, SESSION_TOKEN_PEPPER, BREVO_API_KEY) NUNCA
# ficam aqui — são cadastrados via `wrangler secret put <NOME>`, que os
# guarda criptografados no lado da Cloudflare, fora do repositório. Ver
# docs/DEPLOYMENT.md.
[vars]
APP_BASE_URL = "https://diretoria-dpf.github.io/plataforma-membros/"
# localhost:4174 é o servidor de pré-visualização local (frontend/dev-server.js) —
# mantido na lista só para permitir testar mudanças de front-end localmente
# antes de publicar; não concede acesso a nada que o token de sessão já não
# controle.
ALLOWED_ORIGINS = "https://diretoria-dpf.github.io,http://localhost:4174,http://localhost:4175"
MAIL_FROM_NAME = "Plataforma de Membros"
# Precisa ser um remetente CADASTRADO E VERIFICADO no painel da Brevo
# (Campanhas > Remetentes, ou Configurações > Remetentes) antes de
# funcionar — a Brevo rejeita envio de um endereço não verificado.
MAIL_FROM_ADDRESS = "laiftligauninassau@gmail.com"
# URL pública do bucket R2 (avatares e imagens de evento) — não é segredo,
# é só onde os arquivos ficam publicamente acessíveis depois do upload.
MEDIA_PUBLIC_URL = "https://pub-f449f2cc117b4cc3a34c374218ac2e99.r2.dev"

# Bucket R2 para avatares de perfil e imagens de evento. O Worker escreve
# aqui via binding nativo (sem precisar de credencial de API separada); o
# acesso de LEITURA pública é pela URL acima.
[[r2_buckets]]
bucket_name = "plataforma-membros-media"
binding = "MEDIA_BUCKET"
