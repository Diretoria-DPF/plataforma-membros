name = "plataforma-membros-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# CORTE PARA laift.com.br (docs/MIGRACAO_CLOUDFLARE.md) — só depois de a zona
# estar "Active" no Cloudflare, descomente o bloco abaixo e faça o deploy.
# `workers_dev = true` mantém a URL antiga (*.workers.dev) funcionando para o
# front do GitHub Pages durante a transição; sem ele, definir `routes` a desliga.
# Ao cortar, troque também APP_BASE_URL para "https://laift.com.br/" (links de
# confirmação/redefinição de senha enviados por e-mail).
workers_dev = true
[[routes]]
pattern = "api.laift.com.br"
custom_domain = true

# Segredos reais (DATABASE_URL, SESSION_TOKEN_PEPPER, BREVO_API_KEY e, na
# Fase 3, GROQ_API_KEYS) NUNCA ficam aqui — são cadastrados via `wrangler
# secret put <NOME>`, que os guarda criptografados no lado da Cloudflare,
# fora do repositório. Ver docs/DEPLOYMENT.md e docs/FASE_3_IA_CLINICA.md.
[vars]
APP_BASE_URL = "https://laift.com.br/"
# localhost:4174 é o servidor de pré-visualização local (frontend/dev-server.js) —
# mantido na lista só para permitir testar mudanças de front-end localmente
# antes de publicar; não concede acesso a nada que o token de sessão já não
# controle.
# https://laift.com.br já entra na lista antes do corte: é só uma origem
# permitida, não muda nada para quem usa o GitHub Pages. Na migração, a
# origem do github.io continua até o fim do período de transição.
ALLOWED_ORIGINS = "https://diretoria-dpf.github.io,https://laift.com.br,http://localhost:4174,http://localhost:4175"
MAIL_FROM_NAME = "Plataforma de Membros"
# Precisa ser um remetente CADASTRADO E VERIFICADO no painel da Brevo
# (Campanhas > Remetentes, ou Configurações > Remetentes) antes de
# funcionar — a Brevo rejeita envio de um endereço não verificado.
MAIL_FROM_ADDRESS = "laiftligauninassau@gmail.com"
# URL pública do bucket R2 (avatares e imagens de evento) — não é segredo,
# é só onde os arquivos ficam publicamente acessíveis depois do upload.
MEDIA_PUBLIC_URL = "https://pub-f449f2cc117b4cc3a34c374218ac2e99.r2.dev"
# Fase 3 — IA (Groq). Modelos por recurso: FAST para a conversa com o
# paciente virtual, SMART para avaliação, geração de caso e preceptor do
# laboratório (worker/src/ai/config.js). Para usar um modelo só, ponha o
# mesmo valor nos dois. As CHAVES não ficam aqui: `wrangler secret put
# GROQ_API_KEYS` (todas as chaves do pool, uma por linha ou separadas por
# vírgula) — ver docs/FASE_3_IA_CLINICA.md.
GROQ_MODEL_FAST = "openai/gpt-oss-20b"
GROQ_MODEL_SMART = "openai/gpt-oss-120b"
# Como o pool escolhe a chave: "failover" (usa a 1ª até ela falhar; padrão) ou
# "round-robin" (reveza; só vale a pena com chaves de ORGANIZAÇÕES diferentes,
# porque o limite do Groq é por organização). Ver docs/AI_KEYS.md.
AI_KEY_STRATEGY = "round-robin"
# NVIDIA NIM: cliente construído mas NÃO ligado (nenhum serviço o chama). Os IDs
# vêm do catálogo público (GET https://integrate.api.nvidia.com/v1/models) e
# podem mudar: conferir antes de ligar. A chave é o segredo NVIDIA_API_KEY.
NVIDIA_MODEL_FAST = "nvidia/nemotron-3.5-lightning-30b-a3b"
NVIDIA_MODEL_SMART = "nvidia/nemotron-3-super-120b-a12b"

# Bucket R2 para avatares de perfil e imagens de evento. O Worker escreve
# aqui via binding nativo (sem precisar de credencial de API separada); o
# acesso de LEITURA pública é pela URL acima.
[[r2_buckets]]
bucket_name = "plataforma-membros-media"
binding = "MEDIA_BUCKET"

# Cache de leitura quente (fluxograma, lista pública de eventos) — ver
# worker/src/cache.js. TTL curto (60s), nunca é a autoridade dos dados;
# reduz carga no Neon nas telas de maior tráfego (achado B4 da auditoria
# de 2026-09-25).
[[kv_namespaces]]
binding = "HOT_CACHE"
id = "6ee17e571c044c43bd5b32599b6fbab9"

# Workers AI: gera os embeddings da base da Lia (@cf/baai/bge-m3, ver
# worker/src/services/ragService.js). Sem este binding o RAG NÃO quebra: a busca
# cai para trigramas (pg_trgm) e a resposta segue normalmente. Em staging o binding
# é declarado à parte, em [env.staging.ai] (ver abaixo).
[ai]
binding = "AI"

# Faxina diária (src/maintenance.js): sessões/tokens/rate limit expirados e
# retenção por idade de ai_usage_log (180 dias), atlas_telemetry (90),
# audit_logs (2 anos) e error_logs (30). 06:17 UTC = 03:17 em Brasília,
# fora do horário de uso; o minuto "quebrado" evita a fila do minuto zero.
[triggers]
crons = ["17 6 * * *"]

# ---------------------------------------------------------------------------
# HOMOLOGAÇÃO (staging): Worker `plataforma-membros-api-staging` em
# staging-api.laift.com.br, com banco Neon NOVO E VAZIO (nunca uma cópia nem
# uma branch do banco de produção: ela levaria os dados pessoais dos membros;
# ver docs/DEPLOYMENT.md, seção 10).
# Deploy: `npx wrangler deploy --env staging` ou
# .github/workflows/deploy-staging.yml.
#
# `vars` e os bindings (KV, R2) NÃO são herdados pelo ambiente: o que não
# estiver abaixo não existe em staging. Já `triggers` É herdado, por isso o
# `[env.staging.triggers]` vazio abaixo. Por escolha:
#  - sem cron (a faxina diária só roda em produção);
#  - sem KV e sem R2 (cache vira no-op; upload de avatar não funciona até
#    existirem recursos de teste);
#  - sem *.workers.dev: só o domínio de staging responde;
#  - segredos próprios, cadastrados com `wrangler secret put <NOME> --env
#    staging`: DATABASE_URL (banco de staging), SESSION_TOKEN_PEPPER (valor
#    DIFERENTE do de produção). Não cadastrar BREVO_API_KEY de produção: a
#    homologação não deve mandar e-mail a ninguém.
# ---------------------------------------------------------------------------
[env.staging]
workers_dev = false

[env.staging.triggers]
crons = []

# Workers AI da homologação: o schema do wrangler (env.ai) diz que o binding NÃO é
# herdado do topo e precisa estar em cada ambiente nomeado. Sem este bloco, a
# homologação faria só busca por trigramas, diferente de produção. A reindexação
# diária não roda aqui (crons vazio); a base de staging é embutida pelo admin
# (apiAdminReindexKb) ou por uma execução manual.
[env.staging.ai]
binding = "AI"

[[env.staging.routes]]
pattern = "staging-api.laift.com.br"
custom_domain = true

[env.staging.vars]
APP_BASE_URL = "https://staging.laift.com.br/"
ALLOWED_ORIGINS = "https://staging.laift.com.br,http://localhost:4174,http://localhost:4175"
MAIL_FROM_NAME = "Plataforma de Membros (homologação)"
MAIL_FROM_ADDRESS = "laiftligauninassau@gmail.com"
GROQ_MODEL_FAST = "openai/gpt-oss-20b"
GROQ_MODEL_SMART = "openai/gpt-oss-120b"
AI_KEY_STRATEGY = "failover"
NVIDIA_MODEL_FAST = "nvidia/nemotron-3.5-lightning-30b-a3b"
NVIDIA_MODEL_SMART = "nvidia/nemotron-3-super-120b-a12b"
