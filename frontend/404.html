<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">

  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Página não encontrada · LAIFT</title>
  <meta name="robots" content="noindex">

<body>
  <div id="app-shell" class="app-shell">
    <div class="leaf-field" id="leaf-field" data-leaves="14" aria-hidden="true"></div>

    <main class="public-shell">
      <section class="auth-card" aria-labelledby="error-title">
        <a class="back-link link-btn" href="/" data-history-back>&larr; Voltar</a>
        <span class="brand-pill">Plataforma de Membros</span>
        <h1 id="error-title">Página não encontrada</h1>
        <p class="muted">A página que você procura não existe ou foi movida. Tente voltar à página inicial da plataforma.</p>

        <div class="notfound-icon" aria-hidden="true">🚫</div>

        <!-- "/" (absoluto): o Cloudflare serve esta página em qualquer
             profundidade de URL, e "./" resolveria a partir da URL atual.
             Link com cara de botão, em vez de um <button> dentro de <a>
             (HTML inválido). -->
        <div class="notfound-actions">
          <a class="button-link" href="/">Voltar à página inicial</a>
        </div>
      </section>
    </main>
  </div>

  <!-- Marca d'água da autoria técnica (monograma, uma cor, decorativo). -->
