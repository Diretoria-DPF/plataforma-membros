<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio de Crachá LAIFT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --ui-bg: #0b1220;
      --panel: rgba(16, 24, 40, 0.88);
      --line: rgba(255, 255, 255, 0.09);
      --text-ui: #e8eefc;
      --muted: #93a0b8;
      --ok: #34d399;

      --badge-bg: #f7f4ef;
      --badge-accent: #1d4ed8;
      --badge-text: #111827;

      --laift-logo: url("laift-marca.png");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 600px at 0 0, rgba(37, 99, 235, 0.2), transparent 55%),
        var(--ui-bg);
      color: var(--text-ui);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      max-height: 100vh;
      overflow-y: auto;
      padding: 22px 18px 30px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo-ui {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(145deg, #60a5fa, #1d4ed8);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .brand h1 {
      font-size: 1.05rem;
    }

    .brand p,
    .hint {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .group {
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }

    .group h2 {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    label.field {
      display: block;
      margin-bottom: 10px;
      color: #c9d4ea;
      font-size: 0.78rem;
    }

    input[type="text"],
    input[type="url"],
    textarea {
      width: 100%;
      margin-top: 6px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #0f172a;
      color: #e8eefc;
      font: inherit;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .color-row,
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.82rem;
    }

    .color-row:last-child,
    .switch:last-child {
      border-bottom: 0;
    }

    input[type="color"] {
      width: 42px;
      height: 30px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
    }

    .toggle input {
      width: 0;
      height: 0;
      opacity: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: #334155;
    }

    .slider::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      transition: 0.2s;
    }

    .toggle input:checked + .slider {
      background: var(--ok);
    }

    .toggle input:checked + .slider::before {
      transform: translateX(18px);
    }

    .file-button {
      display: block;
      margin-bottom: 10px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #1e293b;
      color: white;
      text-align: center;
      cursor: pointer;
    }

    .file-button input {
      display: none;
    }

    .actions {
      display: grid;
      gap: 8px;
    }

    button {
      padding: 11px 14px;
      border: 0;
      border-radius: 11px;
      font: 600 14px inherit;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      color: white;
    }

    .secondary {
      border: 1px solid var(--line);
      background: #1e293b;
      color: white;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 16px;
    }

    .stage-head {
      text-align: center;
    }

    .stage-head h2 {
      font: 700 1.7rem Fraunces, serif;
    }

    .stage-head p {
      margin-top: 6px;
      color: var(--muted);
    }

    .scene {
      width: min(86vw, 340px);
      height: calc(min(86vw, 340px) * 85.6 / 54);
      perspective: 1400px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      background: var(--badge-bg);
      color: var(--badge-text);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.48);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .back {
      transform: rotateY(180deg);
    }

    .front-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .hole-wrap {
      display: flex;
      justify-content: center;
      padding-top: 10px;
    }

    .hole {
      width: 34px;
      height: 10px;
      border-radius: 999px;
      background: #0b1220;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45);
    }

    .organization {
      max-height: 3.8em;
      overflow: hidden;
      padding: 8px 12px 0;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    .photo {
      width: 42%;
      aspect-ratio: 1;
      flex: 0 0 auto;
      overflow: hidden;
      margin: 10px auto 8px;
      border: 3px solid var(--badge-accent);
      border-radius: 16px;
      background: #dbe3f0;
    }

    .photo img,
    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar {
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(160deg, var(--badge-accent), #0f172a);
      font: 2rem Fraunces, serif;
    }

    .person {
      position: relative;
      z-index: 0;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: flex-start;
      min-height: 0;
      padding: 0 12px 8px;
      text-align: center;
    }

    .person::before {
      content: "";
      position: absolute;
      inset: 20px 14px 0;
      z-index: -1;
      background-image: var(--laift-logo);
      background-repeat: no-repeat;
      background-position: center;
      background-size: min(68%, 150px);
      opacity: 0.13;
      pointer-events: none;
    }

    .person h3 {
      font: 600 1.15rem/1.15 Fraunces, serif;
      letter-spacing: -0.03em;
      word-break: break-word;
    }

    .role {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.25;
      word-break: break-word;
      opacity: 0.9;
    }

    .stripe {
      display: grid;
      flex: 0 0 14%;
      place-items: center;
      min-height: 42px;
      padding: 0 8px;
      background: var(--badge-accent);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
    }

    .back-content {
      position: relative;
      z-index: 0;
      display: flex;
      height: 100%;
      flex-direction: column;
      align-items: center;
      padding: 22px 16px 16px;
      text-align: center;
    }

    .back-content::before {
      content: "";
      position: absolute;
      inset: 40px 16px 22px;
      z-index: -1;
      background-image: var(--laift-logo);
      background-repeat: no-repeat;
      background-position: center;
      background-size: min(85%, 235px);
      opacity: 0.08;
      pointer-events: none;
    }

    .back-title {
      position: relative;
      z-index: 1;
      margin-bottom: 10px;
      color: var(--badge-accent);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .qr-box {
      position: relative;
      z-index: 1;
      display: grid;
      width: 46%;
      aspect-ratio: 1;
      flex: 0 0 auto;
      place-items: center;
      padding: 8px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .qr-box img,
    .qr-box canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .instructions {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .badge-id {
      position: relative;
      z-index: 1;
      width: 100%;
      margin-top: auto;
      padding: 8px 10px;
      border-top: 2px solid var(--badge-accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .hidden {
      display: none !important;
    }

    .print-sheet {
      display: none;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        order: -1;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html,
      body {
        width: 210mm;
        height: 297mm;
        background: white !important;
      }

      .sidebar,
      .stage-head,
      .scene,
      .no-print {
        display: none !important;
      }

      .app,
      .stage {
        display: block;
        padding: 0;
      }

      .print-sheet {
        display: block;
        width: 210mm;
        min-height: 297mm;
        padding: 14mm 12mm;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .print-title {
        margin-bottom: 10mm;
        color: #111827;
        font-size: 12pt;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-align: center;
      }

      .print-area {
        display: flex;
        flex-wrap: wrap;
        gap: 12mm;
      }

      .print-badge {
        width: 54mm;
        height: 85.6mm;
        overflow: hidden;
        border: 0.2mm solid #d1d5db;
        border-radius: 3mm;
      }

      .print-badge .face {
        position: relative;
        width: 54mm;
        height: 85.6mm;
        border: 0;
        border-radius: 3mm;
        box-shadow: none;
        backface-visibility: visible !important;
        transform: none !important;
      }

      .print-badge .organization {
        padding: 1.6mm 2mm 0;
        font-size: 6pt;
      }

      .print-badge .photo {
        width: 20mm;
        height: 20mm;
        margin: 2mm auto 1.6mm;
        border-width: 0.6mm;
        border-radius: 2.2mm;
      }

      .print-badge .person {
        padding: 0 2.2mm 1.5mm;
      }

      .print-badge .person::before {
        inset: 7mm 3mm 0;
        background-size: 27mm;
        opacity: 0.09;
      }

      .print-badge .person h3 {
        font-size: 10pt;
      }

      .print-badge .role {
        margin-top: 1mm;
        font-size: 7.5pt;
        opacity: 1;
      }

      .print-badge .stripe {
        flex-basis: 11mm;
        min-height: 11mm;
        font-size: 6.5pt;
      }

      .print-badge .back-content {
        padding: 4mm 3mm 3mm;
      }

      .print-badge .back-content::before {
        inset: 39mm 3mm 5mm;
        background-size: 30mm;
        opacity: 0.06;
      }

      .print-badge .qr-box {
        width: 22mm;
        height: 22mm;
        padding: 1.2mm;
      }

      .print-badge .instructions,
      .print-badge .badge-id {
        font-size: 7pt;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar no-print">
      <div class="brand">
        <div class="logo-ui"></div>
        <div>
          <h1>Studio de Crachá LAIFT</h1>
          <p>Padrão CR-80 vertical · 54 × 85,6 mm</p>
        </div>
      </div>

      <section class="group">
        <h2>Identidade</h2>

        <label class="field">Organização
          <input id="orgInput" type="text" value="Liga Acadêmica Interdisciplinar de Farmacologia e Toxicologia" />
        </label>

        <label class="field">Nome completo
          <input id="nameInput" type="text" />
        </label>

        <label class="field">Cargo / Função
          <input id="roleInput" type="text" />
        </label>

        <label class="field">ID do crachá
          <input id="idInput" type="text" />
        </label>
      </section>

      <section class="group">
        <h2>Foto</h2>

        <label class="file-button">
          Enviar imagem
          <input id="photoFile" type="file" accept="image/*" />
        </label>

        <label class="field">Ou URL da imagem
          <input id="photoUrl" type="url" placeholder="https://..." />
        </label>
      </section>

      <section class="group">
        <h2>Verso e QR Code</h2>

        <label class="field">Matricula / token de validação
          <input id="qrInput" type="text" value="LAIFT|" />
        </label>

        <label class="field">Instruções
          <textarea id="instructionsInput">Apresente o QR Code para validação de presença.</textarea>
        </label>
      </section>

      <section class="group">
        <h2>Cores</h2>

        <div class="color-row">Fundo <input id="bgColor" type="color" value="#f7f4ef" /></div>
        <div class="color-row">Destaque <input id="accentColor" type="color" value="#1d4ed8" /></div>
        <div class="color-row">Texto <input id="textColor" type="color" value="#111827" /></div>
      </section>

      <section class="group">
        <h2>Exibir / ocultar</h2>

        <label class="switch">Foto <span class="toggle"><input id="showPhoto" type="checkbox" checked /><span class="slider"></span></span></label>
        <label class="switch">Organização <span class="toggle"><input id="showOrg" type="checkbox" checked /><span class="slider"></span></span></label>
        <label class="switch">Cargo <span class="toggle"><input id="showRole" type="checkbox" checked /><span class="slider"></span></span></label>
        <label class="switch">QR Code <span class="toggle"><input id="showQr" type="checkbox" checked /><span class="slider"></span></span></label>
        <label class="switch">Instruções <span class="toggle"><input id="showInstructions" type="checkbox" checked /><span class="slider"></span></span></label>
        <label class="switch">ID textual <span class="toggle"><input id="showId" type="checkbox" checked /><span class="slider"></span></span></label>
      </section>

      <div class="actions">
        <button class="primary" id="flipBtn">Virar Crachá (Frente / Verso)</button>
        <button class="secondary" id="printBtn">Imprimir / Exportar</button>
      </div>
    </aside>

    <main class="stage">
      <div class="stage-head no-print">
        <h2>Pré-visualização 3D</h2>
        <p>Edite os dados e acompanhe a personalização em tempo real.</p>
      </div>

      <div class="scene no-print">
        <div class="card" id="card">
          <article class="face" id="front">
            <div class="front-body">
              <div class="hole-wrap"><div class="hole"></div></div>
              <div class="organization bind-org"></div>

              <div class="photo bind-photo">
                <div class="avatar" id="avatar">ID</div>
                <img id="photoImage" class="hidden" alt="Foto do membro" />
              </div>

              <div class="person">
                <h3 class="bind-name"></h3>
                <div class="role bind-role"></div>
              </div>
            </div>

            <div class="stripe">Identificação</div>
          </article>

          <article class="face back" id="back">
            <div class="back-content">
              <div class="back-title">Validação</div>
              <div class="qr-box bind-qr" id="qrCode"></div>
              <p class="instructions bind-instructions"></p>
              <div class="badge-id bind-id"></div>
            </div>
          </article>
        </div>
      </div>

      <div class="print-sheet">
        <p class="print-title">Studio de Crachá LAIFT</p>
        <div class="print-area" id="printArea"></div>
      </div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const elements = {
      org: $("orgInput"),
      name: $("nameInput"),
      role: $("roleInput"),
      id: $("idInput"),
      qr: $("qrInput"),
      instructions: $("instructionsInput"),
      bg: $("bgColor"),
      accent: $("accentColor"),
      text: $("textColor"),
      photoUrl: $("photoUrl"),
      photoFile: $("photoFile"),
      showPhoto: $("showPhoto"),
      showOrg: $("showOrg"),
      showRole: $("showRole"),
      showQr: $("showQr"),
      showInstructions: $("showInstructions"),
      showId: $("showId")
    };

    let localPhotoUrl = "";

    function getInitials(name) {
      return name
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((word) => word[0])
        .join("")
        .toUpperCase() || "ID";
    }

    function setVisibility(selector, visible) {
      document.querySelectorAll(selector).forEach((element) => {
        element.classList.toggle("hidden", !visible);
      });
    }

    function renderQr(target) {
      target.innerHTML = "";

      new QRCode(target, {
        text: elements.qr.value.trim() || " ",
        width: 160,
        height: 160,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function renderPhoto() {
      const image = $("photoImage");
      const avatar = $("avatar");
      const imageUrl = elements.photoUrl.value.trim() || localPhotoUrl;

      avatar.textContent = getInitials(elements.name.value);

      if (!imageUrl) {
        image.classList.add("hidden");
        avatar.classList.remove("hidden");
        return;
      }

      image.src = imageUrl;
      image.classList.remove("hidden");
      avatar.classList.add("hidden");

      image.onerror = () => {
        image.classList.add("hidden");
        avatar.classList.remove("hidden");
      };
    }

    function syncBadge() {
      document.documentElement.style.setProperty("--badge-bg", elements.bg.value);
      document.documentElement.style.setProperty("--badge-accent", elements.accent.value);
      document.documentElement.style.setProperty("--badge-text", elements.text.value);

      document.querySelectorAll(".bind-org").forEach((item) => item.textContent = elements.org.value);
      document.querySelectorAll(".bind-name").forEach((item) => item.textContent = elements.name.value);
      document.querySelectorAll(".bind-role").forEach((item) => item.textContent = elements.role.value);
      document.querySelectorAll(".bind-instructions").forEach((item) => item.textContent = elements.instructions.value);

      document.querySelectorAll(".bind-id").forEach((item) => {
        item.textContent = elements.id.value.trim() ? `ID ${elements.id.value.trim()}` : "";
      });

      setVisibility(".bind-photo", elements.showPhoto.checked);
      setVisibility(".bind-org", elements.showOrg.checked);
      setVisibility(".bind-role", elements.showRole.checked);
      setVisibility(".bind-qr", elements.showQr.checked);
      setVisibility(".bind-instructions", elements.showInstructions.checked);
      setVisibility(".bind-id", elements.showId.checked);

      renderPhoto();
    }

    let qrDelay;

    Object.values(elements).forEach((element) => {
      element.addEventListener("input", () => {
        syncBadge();

        if (element === elements.qr) {
          clearTimeout(qrDelay);
          qrDelay = setTimeout(() => renderQr($("qrCode")), 180);
        }
      });

      element.addEventListener("change", syncBadge);
    });

    elements.photoFile.addEventListener("change", (event) => {
      const file = event.target.files[0];

      if (!file) return;

      if (localPhotoUrl) {
        URL.revokeObjectURL(localPhotoUrl);
      }

      localPhotoUrl = URL.createObjectURL(file);
      elements.photoUrl.value = "";
      syncBadge();
    });

    $("flipBtn").addEventListener("click", () => {
      $("card").classList.toggle("flipped");
    });

    function cloneCardFace(face) {
      const wrapper = document.createElement("div");
      wrapper.className = "print-badge";

      const clone = face.cloneNode(true);

      clone.querySelectorAll("[id]").forEach((element) => {
        element.removeAttribute("id");
      });

      wrapper.appendChild(clone);

      const clonedQr = wrapper.querySelector(".qr-box");

      if (clonedQr && !clonedQr.classList.contains("hidden")) {
        renderQr(clonedQr);
      }

      return wrapper;
    }

    function preparePrint() {
      const printArea = $("printArea");

      printArea.innerHTML = "";
      printArea.appendChild(cloneCardFace($("front")));
      printArea.appendChild(cloneCardFace($("back")));
    }

    $("printBtn").addEventListener("click", () => {
      preparePrint();
      window.print();
    });

    window.addEventListener("beforeprint", preparePrint);

    syncBadge();
    renderQr($("qrCode"));

window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const nome = params.get("nome");
      const cargo = params.get("cargo");
      const qr = params.get("qr");

      if (nome) elements.name.value = decodeURIComponent(nome);
      if (cargo) elements.role.value = decodeURIComponent(cargo);
      if (id) {
        const idLimpo = decodeURIComponent(id);
        elements.id.value = idLimpo;
        elements.qr.value = qr ? decodeURIComponent(qr) : `LAIFT:ID:${idLimpo}`;
      }

      syncBadge();
      renderQr($("qrCode"));
    });
    
  </script>
</body>
</html>
