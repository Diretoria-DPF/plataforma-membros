<!-- =========================================================================
     v2.html — casca do Atlas Anatômico 3D (Onda 1, WP08)
     -------------------------------------------------------------------------
     Página NOVA e separada do index.html atual (que continua no ar sem
     alteração). O WP13 (Onda 2) decide quando/como trocar index.html por
     este arquivo — até lá, os dois convivem.

     Esta página só monta a CASCA (layout responsivo + regiões estáveis).
     O motor 3D (WP04/WP05/WP06), os painéis de conteúdo (WP09) e os modos
     (WP07/WP12) são ligados depois, por js/main.js (WP13), preenchendo as
     regiões abaixo pelos ids fixos — nenhum desses pacotes deveria precisar
     recriar a casca.
     ========================================================================= -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- CSP do módulo (congelada para esta onda pelo plano — docs/SECURITY.md
       vai ganhar a entrada desta página quando o WP13 trocar o index.html).
       'wasm-unsafe-eval' é para o decodificador Draco/meshopt (three.js,
       WP04) — mesma justificativa documentada em scripts/e2e/csp.e2e.js
       para a página antiga; aqui a exceção ainda não está na allowlist
       daquele teste (ver relatório final do WP08). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: https://files.rcsb.org; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- Identidade da Plataforma de Membros — PRIMEIRO script, como nas
       demais páginas de módulo (redireciona ao login se aberto fora dela;
       aplica <html data-theme> antes de qualquer pintura). -->
  <script src="../shared/laift-identity.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e4e9f2">
  <title>LAIFT — Atlas Anatômico 3D</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <!-- Sem classe laift-always-dark: o Atlas v2 segue o tema da plataforma
       (ver docs/ATLAS_UX_SPEC.md §0 e tokens-atlas.css). -->
  <script src="../shared/safe-dom.js"></script>
  <link rel="stylesheet" href="../shared/laift-tokens.css">
  <link rel="stylesheet" href="css/tokens-atlas.css">
  <link rel="stylesheet" href="css/atlas.css">
</head>
<body>

  <!-- =======================================================================
       Barra superior (header) — trilha/voltar, busca, seletor de modo.
       Slots preenchidos por WP09 (busca/trilha) e por shell.js (modo).
       Ver docs/ATLAS_UX_SPEC.md §1.1 e §4.
  ======================================================================= -->
  <header id="atlas-topbar" class="atlas-topbar">
    <div id="atlas-breadcrumb" class="atlas-breadcrumb">
      <button type="button" id="atlas-breadcrumb-back" class="atlas-icon-btn"
              data-action="AtlasShell.navigateBack" hidden aria-label="Voltar">
        <span aria-hidden="true">←</span>
      </button>
      <span id="atlas-breadcrumb-label" class="atlas-breadcrumb-label">Atlas</span>
    </div>

    <!-- Campo de busca (WP09, js/ui/search.js) — mantém o id de
         compatibilidade #bio-search-input dentro deste slot quando montado
         (ver LEGACY_COMPAT em js/core/contracts.js). -->
    <div id="atlas-search-slot" class="atlas-search-slot"></div>

    <nav id="atlas-mode-switch" class="atlas-mode-switch" aria-label="Modo do Atlas">
      <button type="button" id="atlas-mode-trigger" class="atlas-mode-trigger"
              data-action="AtlasShell.toggleModeMenu" aria-haspopup="listbox" aria-expanded="false">
        <span id="atlas-mode-trigger-label">Explorar</span>
        <span aria-hidden="true">▾</span>
      </button>
      <div id="atlas-mode-list" class="atlas-mode-list" role="listbox" aria-label="Modos do Atlas"></div>
    </nav>
  </header>

  <!-- =======================================================================
       Corpo 3D (main) — o motor (WP04) monta o <canvas> aqui dentro.
       #atlas-toolbar é FILHO deste container de propósito: assim a mini
       barra de ferramentas se ancora à borda do CANVAS (position: absolute
       dentro de position: relative), não à borda da viewport — em
       desktop/tablet, com o inspetor/navegador abertos, o canvas já é só a
       coluna do meio, então a toolbar não fica por baixo dos painéis sem
       precisar de JS recalculando offsets. O <canvas> do renderer entra
       como irmão da toolbar dentro desta região; a escala de z-index de
       tokens-atlas.css (--atlas-z-canvas < --atlas-z-toolbar) resolve a
       ordem de pintura.
  ======================================================================= -->
  <main id="atlas-canvas" class="atlas-canvas" tabindex="0"
        aria-label="Corpo humano em 3D — use as setas para girar, Enter para selecionar">

    <div id="atlas-toolbar" class="atlas-toolbar" role="toolbar" aria-label="Ferramentas do Atlas" aria-orientation="vertical"></div>
  </main>

  <!-- Navegador em gaveta (tablet/desktop) — WP09 (js/ui/navigator.js)
       monta a árvore sistema→região→órgão aqui. Fechado por padrão. -->
  <aside id="atlas-left-panel" class="atlas-left-panel" aria-label="Navegador de estruturas" hidden></aside>

  <!-- Inspetor persistente (tablet/desktop) — WP09 (js/ui/infocard.js)
       monta a ficha da estrutura aqui. Fechado por padrão (sem seleção). -->
  <aside id="atlas-inspector" class="atlas-inspector" aria-label="Ficha da estrutura" hidden>
    <!-- Compat: o cabeçalho da ficha, quando montado pelo WP09, deve reusar
         o mesmo #organ-hud/#organ-name do painel inferior (ver LEGACY_COMPAT)
         quando o inspetor for a superfície ativa (tablet/desktop). -->
  </aside>

  <!-- =======================================================================
       Painel arrastável (bottom sheet no retrato / lateral na paisagem).
       Ver docs/ATLAS_UX_SPEC.md §2. Só é a superfície ativa em telas de
       celular (<600px) — em tablet/desktop o inspetor acima assume.
  ======================================================================= -->
  <section id="atlas-sheet" class="atlas-sheet" data-sheet-state="peek"
           role="region" aria-label="Painel do Atlas">
    <!-- Atalhos de teclado sem arraste (§2.5) — ocultos visualmente. -->
    <button type="button" class="laift-sr-only" data-action="AtlasSheet.snapPeek">Recolher</button>
    <button type="button" class="laift-sr-only" data-action="AtlasSheet.snapHalf">Meio</button>
    <button type="button" class="laift-sr-only" data-action="AtlasSheet.snapFull">Expandir</button>

    <button type="button" id="atlas-sheet-handle" class="atlas-sheet-handle" aria-label="Arrastar painel (Enter alterna, Esc recolhe)"></button>

    <div id="atlas-sheet-peek" class="atlas-sheet-peek">
      <!-- Compat: hooks legados mantidos (ver LEGACY_COMPAT em contracts.js).
           WP09 preenche #organ-name / o conteúdo do cabeçalho da ficha. -->
      <div id="organ-hud" class="hidden" role="status">
        <strong id="organ-name">---</strong>
      </div>
      <p id="atlas-sheet-hint" class="atlas-sheet-hint">Toque numa estrutura para começar</p>
    </div>

    <div id="atlas-sheet-body" class="atlas-sheet-body"></div>
  </section>

  <!-- Menu de contexto (toque longo / clique direito numa estrutura) — WP06
       decide quando abrir; esta região só existe e recebe posição/foco. -->
  <div id="atlas-context-menu" class="atlas-context-menu" role="menu" aria-label="Ações da estrutura" hidden></div>

  <!-- Modal genérico (créditos, confirmações — --atlas-z-modal). -->
  <dialog id="atlas-modal" class="atlas-modal" aria-label="Diálogo do Atlas">
    <div id="atlas-modal-body" class="atlas-modal-body"></div>
    <button type="button" class="atlas-modal-close" data-action="AtlasShell.closeModal">Fechar</button>
  </dialog>

  <!-- Toast de erro de carregamento etc. -->
  <div id="atlas-toast" class="atlas-toast" role="status" aria-live="polite"></div>

  <!-- Único nó de aria-live do módulo (§16/§17 da spec de UX): anuncia
       seleção/limpeza de estrutura. Fora da árvore visual dos painéis. -->
  <div id="atlas-live" class="laift-sr-only" aria-live="polite"></div>

  <script type="module" src="js/ui/v2-entry.js"></script>
</body>
</html>
