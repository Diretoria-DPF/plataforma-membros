<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Credits Demo</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    .demo-container {
      max-width: 800px;
      margin: 0 auto;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #0052a3;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .error {
      color: #d32f2f;
      background: #ffebee;
      border-color: #d32f2f;
    }
    .success {
      color: #388e3c;
      background: #e8f5e9;
      border-color: #388e3c;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>Credits Modal Demo</h1>
    <button id="openCredits">Abrir Créditos</button>
    <div id="status" class="status" style="display: none;"></div>
  </div>

  <script src="../modulos/shared/safe-dom.js"></script>
  <script src="credits-demo.js"></script>
</body>
</html>
