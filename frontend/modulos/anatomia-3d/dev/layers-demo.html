<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Layers Panel Demo</title>
  <!-- Tokens CSS (ordem: LAIFT base, depois Atlas-específico, depois componente) -->
  <link rel="stylesheet" href="../../shared/laift-tokens.css">
  <link rel="stylesheet" href="../css/tokens-atlas.css">
  <link rel="stylesheet" href="../css/layers-panel.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    body {
      background: #f5f5f5;
      padding: 20px;
      overflow: auto;
    }

    .demo-container {
      max-width: 390px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .demo-header {
      background: #2c3e50;
      color: white;
      padding: 16px;
      text-align: center;
    }

    .demo-header h1 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .demo-header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .demo-content {
      padding: 20px;
      min-height: 400px;
      max-height: 844px;
      overflow-y: auto;
    }

    .demo-log {
      margin-top: 40px;
      padding: 16px;
      background: #f0f0f0;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
    }

    .demo-log h3 {
      margin-bottom: 8px;
      font-size: 12px;
    }

    .demo-log-item {
      padding: 4px 0;
      border-bottom: 1px solid #ddd;
      word-break: break-all;
    }

    .demo-log-item:last-child {
      border-bottom: none;
    }

    .error-box {
      background: #fee;
      border: 1px solid #f88;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 16px;
      color: #c33;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1>Painel de Camadas</h1>
      <p>Demo do componente layers-panel (viewport 390×844)</p>
    </div>
    <div class="demo-content">
      <div id="panel-mount"></div>
      <div class="demo-log">
        <h3>Eventos emitidos:</h3>
        <div id="events-log"></div>
      </div>
    </div>
  </div>

  <script src="../../shared/safe-dom.js"></script>
  <script src="layers-demo.js" type="module"></script>
</body>
</html>
