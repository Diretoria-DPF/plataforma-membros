<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Study Mode Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      padding: 1rem;
    }
    .demo-container {
      max-width: 390px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .demo-header {
      background: #4285f4;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .demo-sheet {
      height: 844px;
      overflow-y: auto;
      padding: 1rem;
    }
    button {
      cursor: pointer;
    }
    .demo-status {
      margin-top: 2rem;
      padding: 1rem;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1>Study Mode Demo</h1>
    </div>
    <div id="sheet" class="demo-sheet"></div>
  </div>

  <script src="../../shared/safe-dom.js"></script>
  <script type="module" src="study-demo.js"></script>
</body>
</html>
