<!-- =========================================================================
     index.html — Atlas Anatômico 3D v2 (Onda 2, WP13)
     -------------------------------------------------------------------------
     Casca definitiva do módulo responsivo (Mobile & Desktop).
     ========================================================================= -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: https://cdn.jsdelivr.net https://files.rcsb.org https://pubchem.ncbi.nlm.nih.gov; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  
  <!-- Identidade da Plataforma de Membros -->
  <script src="../shared/laift-identity.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e4e9f2">
  <title>LAIFT — Atlas Anatômico 3D</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <script src="../shared/safe-dom.js"></script>
  <link rel="stylesheet" href="../shared/laift-tokens.css">
  <link rel="stylesheet" href="css/tokens-atlas.css">
  <link rel="stylesheet" href="css/atlas.css">
  <link rel="stylesheet" href="css/labels.css">
  <link rel="stylesheet" href="css/infocard.css">
  <link rel="stylesheet" href="css/layers-panel.css">
  <link rel="stylesheet" href="css/navigator.css">
  <link rel="stylesheet" href="css/search-box.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/credits.css">

  <style>
    /* =====================================================================
       Correção de Layout Desktop (>= 600px):
       Garante que o painel de interação (modos/estudo/ficha) permaneça
       ativo e visível no desktop como uma coluna lateral direita.
       ===================================================================== */
    @media (min-width: 600px) {
      body {
        display: flex;
        flex-direction: row;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      /* Painel de interação (modos e ficha): lateral direito acoplado */
      .atlas-sheet {
        display: flex !important;
        position: fixed;
        top: calc(var(--atlas-topbar-h, 56px) + env(safe-area-inset-top, 0px));
        bottom: 0;
        right: 0;
        left: auto;
        width: clamp(340px, 32vw, 460px);
        height: auto !important;
        max-height: none !important;
        border-radius: var(--laift-radius-lg, 16px) 0 0 0;
        border-left: 1px solid var(--laift-border);
        box-shadow: var(--laift-shadow, -4px 0 16px rgba(0, 0, 0, 0.15));
        z-index: var(--atlas-z-sheet, 40);
        background: var(--laift-surface);
      }

      .atlas-sheet-handle {
        display: none !important;
      }

      .atlas-sheet-peek {
        padding: var(--laift-space-3, 12px) var(--laift-space-4, 16px);
        border-bottom: 1px solid var(--laift-border);
        flex-shrink: 0;
      }

      .atlas-sheet-body {
        display: block !important;
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: var(--laift-space-4, 16px);
      }

      /* O canvas 3D ocupa todo o espaço disponível restante */
      .atlas-canvas {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        inset: auto;
      }

      /* Afasta a toolbar vertical para não colidir com o painel lateral */
      .atlas-toolbar {
        right: calc(clamp(340px, 32vw, 460px) + 16px) !important;
        transition: right 0.2s ease;
      }
    }
  </style>
</head>
<body>

  <!-- =======================================================================
       Barra superior (header) — trilha/voltar, busca, seletor de modo.
  ======================================================================= -->
  <header id="atlas-topbar" class="atlas-topbar">
    <div id="atlas-breadcrumb" class="atlas-breadcrumb">
      <button type="button" id="atlas-breadcrumb-back" class="atlas-icon-btn"
              data-action="AtlasShell.navigateBack" hidden aria-label="Voltar">
        <span aria-hidden="true">←</span>
      </button>
      <span id="atlas-breadcrumb-label" class="atlas-breadcrumb-label">Atlas</span>
    </div>

    <!-- Campo de busca -->
    <div id="atlas-search-slot" class="atlas-search-slot"></div>

    <nav id="atlas-mode-switch" class="atlas-mode-switch" aria-label="Modo do Atlas">
      <button type="button" id="atlas-mode-trigger" class="atlas-mode-trigger"
              data-action="AtlasShell.toggleModeMenu" aria-haspopup="listbox" aria-expanded="false">
        <span id="atlas-mode-trigger-label">Explorar</span>
        <span aria-hidden="true">▾</span>
      </button>
      <div id="atlas-mode-list" class="atlas-mode-list" role="listbox" aria-label="Modos do Atlas"></div>
    </nav>
  </header>

  <!-- =======================================================================
       Corpo 3D (main) — Canvas 3D e Toolbar flutuante
  ======================================================================= -->
  <main id="atlas-canvas" class="atlas-canvas" tabindex="0"
        aria-label="Corpo humano em 3D — use as setas para girar, Enter para selecionar">
    <div id="atlas-toolbar" class="atlas-toolbar" role="toolbar" aria-label="Ferramentas do Atlas" aria-orientation="vertical"></div>
  </main>

  <!-- Navegador em gaveta (tablet/desktop) -->
  <aside id="atlas-left-panel" class="atlas-left-panel" aria-label="Navegador de estruturas"></aside>

  <!-- Inspetor persistente (tablet/desktop) -->
  <aside id="atlas-inspector" class="atlas-inspector" aria-label="Ficha da estrutura"></aside>

  <!-- =======================================================================
       Painel de Interação e Conteúdo dos Modos:
       - No celular (<600px): Bottom sheet deslizável (peek / half / full)
       - No desktop (>=600px): Coluna lateral direita acoplada
  ======================================================================= -->
  <section id="atlas-sheet" class="atlas-sheet" data-sheet-state="half"
           role="region" aria-label="Painel do Atlas">
    <!-- Atalhos de teclado -->
    <button type="button" class="laift-sr-only" data-action="AtlasSheet.snapPeek">Recolher</button>
    <button type="button" class="laift-sr-only" data-action="AtlasSheet.snapHalf">Meio</button>
    <button type="button" class="laift-sr-only" data-action="AtlasSheet.snapFull">Expandir</button>

    <button type="button" id="atlas-sheet-handle" class="atlas-sheet-handle" aria-label="Arrastar painel (Enter alterna, Esc recolhe)"></button>

    <div id="atlas-sheet-peek" class="atlas-sheet-peek">
      <div id="organ-hud" class="hidden" role="status">
        <strong id="organ-name">---</strong>
      </div>
      <p id="atlas-sheet-hint" class="atlas-sheet-hint">Toque numa estrutura ou selecione um modo acima</p>
    </div>

    <div id="atlas-sheet-body" class="atlas-sheet-body"></div>
  </section>

  <!-- Menus e Diálogos Flutuantes -->
  <div id="atlas-context-menu" class="atlas-context-menu" role="menu" aria-label="Ações da estrutura" hidden></div>

  <dialog id="atlas-modal" class="atlas-modal" aria-label="Diálogo do Atlas">
    <div id="atlas-modal-body" class="atlas-modal-body"></div>
    <button type="button" class="atlas-modal-close" data-action="AtlasShell.closeModal">Fechar</button>
  </dialog>

  <div id="atlas-toast" class="atlas-toast" role="status" aria-live="polite"></div>
  <div id="atlas-live" class="laift-sr-only" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/ui/context-menu.js"></script>
  <script src="js/ui/credits.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/compat/legacy-api.js"></script>
</body>
</html>
