    <circle class="p" cx="148" cy="237" r="1.6"/>
  </g>
  <g id="lia-pv-bolha-3" data-cena="1" data-pai="#lia-prop-flask">
    <circle class="p" cx="153" cy="243" r="1.6"/>
  </g>
  <g id="lia-pv-monitor" data-cena="2" data-pai="svg">
    <rect class="p rd" x="166" y="86" width="52" height="38"/>
    <g id="lia-pv-ecg">
      <path class="ln" d="M171 112h9l3-12 4 22 3-16 3 6h7l3-4 2 4h9"/>
    </g>
    <g id="lia-pv-coracao">
      <circle class="t" cx="211" cy="95" r="2.6"/>
    </g>
  </g>
  <g id="lia-pv-osso" data-cena="3" data-pai="svg">
    <rect class="p" x="170" y="168" width="16" height="6" rx="3"/>
    <circle class="p" cx="168" cy="166" r="3"/>
    <circle class="p" cx="168" cy="172" r="3"/>
    <circle class="p" cx="188" cy="166" r="3"/>
    <circle class="p" cx="188" cy="172" r="3"/>
  </g>
  <g id="lia-pv-estrela" data-cena="3" data-pai="svg">
    <path class="s n" d="M0-8 2-2 8 0 2 2 0 8-2 2-8 0-2-2z" transform="translate(184 150) scale(1.4)"/>
