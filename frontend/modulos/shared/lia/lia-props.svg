  <g id="lia-pv-folha" data-cena="4" data-pai="svg">
    <path class="p" d="M100 160c12-5 24-5 36 0v28c-12-5-24-5-36 0z"/>
  </g>
  <g id="lia-pv-interrogacao" data-cena="4" data-pai="svg">
