<?xml version="1.0" encoding="UTF-8"?>
<!-- Props e poses novos das cenas 1-7 (Onda 2, ADR 0003). Fonte de lia-props-art.js (build-lia-art.mjs).
     Cada <g> de topo e um id lia-pv-* do contrato (README, secao "Contrato de ids").
     data-cena = cena da onda (1-7). data-pai = onde o no entra: "svg" = raiz do .lia-svg (coordenadas do viewBox 200x300);
     "#lia-prop-flask", "#lia-head", "#lia-coat" = id existente em lia.svg (coordenadas do proprio grupo).
     data-posicao="primeiro" = inserir antes de #lia-body (atras do corpo).
     Cores so por classes da paleta: p k c h a t s n rd (lia.css) e ln al gi vu (novas, ver README). Traco = --lia-stroke. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <g id="lia-pv-veu" data-cena="5" data-pai="svg" data-posicao="primeiro" opacity="0">
    <rect class="vu" x="-80" y="-40" width="360" height="380" rx="8"/>
  </g>
  <g id="lia-pv-liquido-b" data-cena="1" data-pai="#lia-prop-flask">
    <path class="s" d="M132 234h30l4 8a4 4 0 01-3.5 6H131.5a4 4 0 01-3.5-6z"/>
  </g>
  <g id="lia-pv-bolha-1" data-cena="1" data-pai="#lia-prop-flask">
    <circle class="p" cx="140" cy="241" r="1.6"/>
  </g>
