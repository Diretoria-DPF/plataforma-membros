<!--
  Navegação estática (sem dados de banco), em formato de barra inferior fixa
  (padrão de app mobile — a maioria das pessoas vai acessar pelo celular).
  A visibilidade por papel é só conveniência de interface — a autorização
  real acontece sempre no servidor (ver Security.gs / cada Service.gs), então
  mostrar ou esconder um botão aqui nunca é, por si só, controle de acesso.
-->
<nav class="bottom-nav" id="app-nav" aria-label="Navegação principal">
  <button type="button" data-panel="panel-home" data-scope="all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg>
    <span>Início</span>
  </button>
  <button type="button" data-panel="panel-events" data-scope="all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    <span>Eventos</span>
  </button>
  <button type="button" data-panel="panel-proposals" data-scope="all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l14-7-4 16-4-6-6-3z"/></svg>
    <span>Propostas</span>
  </button>
  <button type="button" data-panel="panel-tasks" data-scope="member">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.3 2.3L16 10"/></svg>
    <span>Tarefas</span>
  </button>
  <button type="button" data-panel="panel-profile" data-scope="all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
    <span>Perfil</span>
  </button>
  <button type="button" id="btn-open-admin-sheet" data-scope="admin" aria-haspopup="true" aria-controls="admin-sheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
    <span>Admin</span>
  </button>
</nav>

<!-- Gaveta (bottom sheet) com as telas administrativas, para não lotar a
     barra inferior. Abre/fecha via JS em Scripts.html. -->
<div id="admin-sheet" class="sheet-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="admin-sheet-title">
  <div class="sheet-box">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h3 id="admin-sheet-title">Administração</h3>
    <div class="sheet-grid">
      <button type="button" class="sheet-item" data-panel="panel-admin-dashboard">Painel admin</button>
      <button type="button" class="sheet-item" data-panel="panel-admin-users">Usuários</button>
      <button type="button" class="sheet-item" data-panel="panel-admin-events">Gerir eventos</button>
      <button type="button" class="sheet-item" data-panel="panel-admin-proposals">Gerir propostas</button>
      <button type="button" class="sheet-item" data-panel="panel-admin-tasks">Gerir tarefas</button>
      <button type="button" class="sheet-item" data-panel="panel-admin-feedback">Feedback</button>
      <button type="button" class="sheet-item" data-panel="panel-admin-audit">Auditoria</button>
    </div>
    <button type="button" class="secondary" id="btn-close-admin-sheet">Fechar</button>
  </div>
</div>
