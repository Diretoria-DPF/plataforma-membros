name: Publicar front-end na Cloudflare (Workers static assets)

# Publica frontend/dist na Cloudflare:
#   branch main    → produção   (Worker laift-web,         https://laift.com.br)
#   branch staging → homologação (Worker laift-web-staging, https://staging.laift.com.br)
# Dispara sozinho a cada push dessas branches que mexa em frontend/, e também à
# mão (aba Actions → este workflow → escolha a branch em "Use workflow from").
# Qualquer outra branch é recusada: nada de publicar branch de trabalho em produção.
#
# Antes de publicar, roda os testes unitários do front e os e2e "csp" e "smoke"
# (um CSP quebrado ou um script externo não liberado BLOQUEIA a publicação).
# Depois de publicar, tools/ci/smoke.mjs confere o site e a API do ambiente.
#
# O ambiente do GitHub ("production" / "staging") permite exigir aprovação de uma
# pessoa antes do deploy: Settings → Environments → production → Required reviewers.
#
# Segredos do repositório (os mesmos do deploy do Worker da API):
#   CLOUDFLARE_API_TOKEN  — token "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID — opcional se o token só enxerga uma conta
# Para ligar o domínio pelo wrangler, o token também precisa de permissão na ZONA
# laift.com.br (DNS: Edit e Workers Routes: Edit). Ver docs/AMBIENTES.md.

on:
  push:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Uma publicação por branch de cada vez; a mais nova espera a anterior.
concurrency:
  group: frontend-cloudflare-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Só main (produção) e staging (homologação) publicam
        run: |
          case "$GITHUB_REF_NAME" in
            main|staging) echo "Destino: $GITHUB_REF_NAME" ;;
            *) echo "::error::Este workflow só publica a partir da branch main (produção) ou staging (homologação). Escolha uma delas em \"Use workflow from\"."; exit 1 ;;
          esac

      # SEO/robots, domínio, MFA, PWA, home, staging… Não precisam de npm install.
      - name: Testes unitários do front
        run: node --test frontend/scripts/*.test.mjs frontend/redirect-www/*.test.mjs

      - name: Instala dependências do front e o navegador do Playwright
        working-directory: frontend
        run: |
          npm ci || npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Gera o build
        working-directory: frontend
        run: node scripts/build.js

      # CSP em todas as páginas publicadas e o fluxo básico de entrada.
      - name: Testes e2e (csp e smoke)
        working-directory: frontend
        run: node scripts/e2e/run.js csp smoke

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DESTINO: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
      SMOKE_SITE_URL: ${{ github.ref_name == 'main' && 'https://laift.com.br' || 'https://staging.laift.com.br' }}
      SMOKE_API_URL: ${{ github.ref_name == 'main' && 'https://api.laift.com.br' || 'https://staging-api.laift.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instala dependências do build (javascript-obfuscator)
        working-directory: frontend
        run: npm ci || npm install

      - name: Gera frontend/dist/ (app.js ofuscado; _headers e demais arquivos copiados)
        working-directory: frontend
        run: npm run build

      # Mesma validação do deploy do Worker: aceita o token colado com quebra
      # de linha/aspas, mascara o valor limpo e confirma que a Cloudflare o
      # considera ativo antes de publicar.
      - name: Confere o token da Cloudflare
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d "\"'\r" | tr -s '[:space:]' '\n' | grep -E '^[A-Za-z0-9_-]{35,80}$' | head -n1 || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::O segredo CLOUDFLARE_API_TOKEN não contém um token válido."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          STATUS=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          if [ "$STATUS" != "200" ] || ! grep -Eq '"status" *: *"active"' /tmp/verify.json; then
            echo "::error::A Cloudflare recusou o token (HTTP $STATUS)."
            exit 1
          fi
          echo "Token da Cloudflare válido e ativo."
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d "\"'[:space:]")
          if [ -n "$ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      # Versão do wrangler fixada na major 4 para o deploy ser reproduzível.
      - name: Publica o front-end (${{ env.DESTINO }})
        working-directory: frontend
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npx --yes wrangler@4 deploy
          else
            npx --yes wrangler@4 deploy --env staging
          fi

      # Site e API do ambiente que acabou de ser publicado. Tenta por ~2 min
      # porque a Cloudflare leva alguns segundos para propagar a versão nova.
      - name: Teste de fumaça do ambiente publicado
        run: node tools/ci/smoke.mjs --retry 6 --delay 20
