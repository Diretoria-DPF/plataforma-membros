name: Publicar homologação (staging)

# Publica QUALQUER branch na homologação, só à mão (aba Actions → este
# workflow → escolha a branch em "Use workflow from" → "Run workflow"):
#   API   → Worker plataforma-membros-api-staging (staging-api.laift.com.br)
#   Site  → Worker laift-web-staging              (staging.laift.com.br)
# A homologação tem banco Neon próprio, sem dados reais, e não manda e-mail.
# Passo a passo e segredos do ambiente: docs/DEPLOYMENT.md, seção 10.
#
# Segredos do repositório (os mesmos do deploy de produção):
#   CLOUDFLARE_API_TOKEN  — token "Edit Cloudflare Workers"; para o domínio de
#                           staging também precisa de DNS: Edit e Workers
#                           Routes: Edit na zona laift.com.br
#   CLOUDFLARE_ACCOUNT_ID — opcional se o token só enxerga uma conta
# Os segredos da API de staging (DATABASE_URL etc.) ficam NA Cloudflare,
# cadastrados com `wrangler secret put <NOME> --env staging`.

on:
  # Push na branch `staging`: publica a API sozinho (migra o banco de staging se
  # existir o segredo STAGING_DATABASE_URL, publica o Worker e roda o smoke test).
  # O SITE de staging é publicado por deploy-frontend-cloudflare.yml, que também
  # dispara no push de `staging`; aqui o job `site` só roda no disparo manual.
  push:
    branches: [staging]
    paths:
      - 'worker/**'
      - 'sql/**'
      - 'tools/db/**'
      - 'tools/ci/smoke.mjs'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:
    inputs:
      alvo:
        description: 'O que publicar'
        type: choice
        options: [ambos, api, site]
        default: ambos

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  api:
    if: ${{ inputs.alvo != 'site' }}
    runs-on: ubuntu-latest
    # Ambiente do GitHub: permite restringir as branches que podem publicar e
    # exigir aprovação (Settings → Environments → staging). Ver DEPLOYMENT.md §10.
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Instala dependências
        working-directory: worker
        run: npm ci

      - name: Testes da Worker
        working-directory: worker
        run: npm test

      - name: Confere o token da Cloudflare
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d "\"'\r" | tr -s '[:space:]' '\n' | grep -E '^[A-Za-z0-9_-]{35,80}$' | head -n1 || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::O segredo CLOUDFLARE_API_TOKEN não contém um token válido."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          STATUS=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          if [ "$STATUS" != "200" ] || ! grep -Eq '"status" *: *"active"' /tmp/verify.json; then
            echo "::error::A Cloudflare recusou o token (HTTP $STATUS)."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d "\"'[:space:]")
          if [ -n "$ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      # Migra ANTES de publicar o código, para o Worker novo já achar as tabelas.
      # Só roda se o segredo STAGING_DATABASE_URL (URL DIRETA do Neon de staging,
      # nunca a de produção) existir no ambiente "staging"; sem ele, avisa e segue.
      # Um banco que já foi migrado à mão precisa do baseline uma única vez:
      #   DATABASE_URL=... node tools/db/migrate.mjs --baseline-through 015
      - name: Migra o banco de homologação (se houver STAGING_DATABASE_URL)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::STAGING_DATABASE_URL não cadastrado: migrações NÃO aplicadas. Ver docs/AMBIENTES.md."
            exit 0
          fi
          (cd tools/db && npm ci)
          node tools/db/migrate.mjs

      - name: Publica a API de homologação
        working-directory: worker
        run: npx wrangler deploy --env staging

  site:
    # No push de `staging` o site é publicado por deploy-frontend-cloudflare.yml.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.alvo != 'api' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências do build (javascript-obfuscator)
        working-directory: frontend
        run: npm ci

      - name: Gera frontend/dist/
        working-directory: frontend
        run: npm run build

      - name: Confere o token da Cloudflare
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d "\"'\r" | tr -s '[:space:]' '\n' | grep -E '^[A-Za-z0-9_-]{35,80}$' | head -n1 || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::O segredo CLOUDFLARE_API_TOKEN não contém um token válido."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          STATUS=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          if [ "$STATUS" != "200" ] || ! grep -Eq '"status" *: *"active"' /tmp/verify.json; then
            echo "::error::A Cloudflare recusou o token (HTTP $STATUS)."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d "\"'[:space:]")
          if [ -n "$ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Publica o site de homologação
        working-directory: frontend
        run: npx --yes wrangler@4 deploy --env staging

  # Teste de fumaça depois do deploy: site responde 200 com CSP e a API responde
  # apiGetFeatureFlags. Tenta por ~3 min porque, no push, o site de staging é
  # publicado em paralelo por deploy-frontend-cloudflare.yml.
  smoke:
    needs: [api, site]
    # Roda se nenhum dos dois falhou (um deles pode ter sido pulado de propósito).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      SMOKE_SITE_URL: https://staging.laift.com.br
      SMOKE_API_URL: https://staging-api.laift.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Teste de fumaça da homologação
        run: node tools/ci/smoke.mjs --retry 9 --delay 20
