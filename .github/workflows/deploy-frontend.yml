name: Publicar front-end no GitHub Pages

# Só manual: com o repositório privado o GitHub Pages do plano gratuito não publica (o endereço
# diretoria-dpf.github.io saiu do ar). O site de verdade é o Worker `laift-web`
# (deploy-frontend-cloudflare.yml). Se o repositório voltar a ser público, devolva o gatilho de push na main.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Instala dependências do build (javascript-obfuscator)
        working-directory: frontend
        run: npm install
      - name: Gera frontend/dist/ (app.js ofuscado; index.html/styles.css copiados)
        working-directory: frontend
        run: npm run build
      - name: Cópia do Pages fora dos buscadores (noindex + canonical para laift.com.br)
        run: node tools/ci/pages-noindex.mjs frontend/dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
